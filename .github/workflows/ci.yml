name: ci

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly: 1M-case parser fuzz (PR/push runs only the 10k default).
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  fuzz-nightly:
    name: Parser fuzz — nightly 1M cases
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run 1M-case parser fuzz
        run: MONA_FUZZ_CASES=1000000 node --test apps/desktop/test/parse-fuzz.test.mjs

  test:
    name: Test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full test suite (unit + security red-team)
        run: npm test

      - name: Lint (syntax check)
        run: npm run lint

      - name: Control-plane import guard (device must not import the server library)
        run: |
          if grep -rnE "from '@mona/control-plane'|import\('@mona/control-plane'\)" apps/ packages/engine; then
            echo "::error::apps/desktop or packages/engine imports the control-plane library — the device must never depend on it"
            exit 1
          fi

      - name: Typecheck (declaration tests)
        run: npm run typecheck

      - name: Windows CLI smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node apps/desktop/bin/mona-agent.js status
          # Service adapter argument building + output parsing run on every OS
          # (portable unit tests); the SCM script itself is parameterized only.
          if (Get-Content apps/desktop/src/windows-service.ps1 -Raw | Select-String '-Command') {
            throw 'windows-service.ps1 must never accept raw -Command input'
          }
          if (Get-Content apps/desktop/src/tools/shell.js -Raw | Select-String "powershell.exe', \[.*-Command") {
            throw 'shell.js must never pass a user string to PowerShell'
          }

  lifecycle-acceptance:
    name: Installer lifecycle acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lifecycle state-machine acceptance
        run: node --test packages/engine/test/package-lifecycle.test.mjs

      - name: Linux installer dry-run acceptance
        if: runner.os == 'Linux'
        run: |
          test -x apps/desktop/install.sh
          MONA_REPO=MONAEXPERT/agent apps/desktop/install.sh --dry-run --allow-root

      - name: Windows installer dry-run acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/desktop/install.ps1 -DryRun

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: npm audit (high+)
        run: npm audit --audit-level=high

  security:
    name: Security scan (CodeQL + secret detection)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reproducibility:
    name: Reproducible source archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Two independent deterministic packs of the source tree must be
      # byte-identical; a difference means the build is not reproducible.
      - name: Verify deterministic source archive
        run: |
          pack() {
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              --exclude-vcs --exclude=node_modules --exclude='.github' \
              -czf "$1" .
          }
          pack first.tar.gz
          pack second.tar.gz
          test "$(sha256sum first.tar.gz | cut -d' ' -f1)" = "$(sha256sum second.tar.gz | cut -d' ' -f1)"
